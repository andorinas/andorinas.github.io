<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="./favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="ControlAr" />
    <link rel="manifest" href="./manifest.webmanifest?v=2" />
    <title>ControlAr · Andorinas</title>
    <script>
      // Después de publicar una versión nueva, el navegador puede tener guardada la página anterior (hasta 10 minutos)
      // apuntando a archivos que ya no existen: queda en blanco. Si falla la carga de un archivo de la app, recarga una vez.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || !(t.tagName === 'SCRIPT' || t.tagName === 'LINK') || !/\/assets\//.test(t.src || t.href || '')) return;
        try {
          var antes = Number(sessionStorage.getItem('recarga-version') || 0);
          if (Date.now() - antes < 60000) return; // ya se intentó hace menos de un minuto: no insistir
          sessionStorage.setItem('recarga-version', String(Date.now()));
        } catch (_) { /* sin almacenamiento: recarga igual, una vez */ }
        location.reload();
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
