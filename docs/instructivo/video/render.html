<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Render de video · ControlAr</title>
<style>
@font-face { font-family: 'Montserrat'; font-weight: 500; src: url('../fuentes/montserrat-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 600; src: url('../fuentes/montserrat-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 700; src: url('../fuentes/montserrat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 800; src: url('../fuentes/montserrat-latin-800-normal.woff2') format('woff2'); }
html, body { margin: 0; background: #222; }
canvas { display: block; width: 960px; height: 540px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const C = { fondo: '#f4f3ef', oscuro: '#151515', azul: '#1f3557', azulOsc: '#0f1a2b', gris: '#5b5b5b', naranja: '#b5530f' };
const AREA = { x: 60, y: 112, w: 1800, h: 808 };
const cv = document.getElementById('c'); const g = cv.getContext('2d');

const cargarImg = (src) => new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('No cargó ' + src)); i.src = src; });
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const tramo = (t, a, b) => ease((t - a) / (b - a));

function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function envolver(texto, ancho) {
  const palabras = texto.split(/\s+/); const lineas = []; let l = '';
  for (const p of palabras) { const prueba = l ? l + ' ' + p : p; if (g.measureText(prueba).width > ancho && l) { lineas.push(l); l = p; } else l = prueba; }
  if (l) lineas.push(l); return lineas;
}

let M; // marca
async function prepararMarca() {
  M = { blanco: await cargarImg('../marca/logo-blanco.png'), negro: await cargarImg('../marca/logo-negro.png'), iso: await cargarImg('../marca/isologo-negro.png') };
  await Promise.all(['500', '600', '700', '800'].map((w) => document.fonts.load(`${w} 40px Montserrat`)));
}

function portada(esc, t, total) {
  const gr = g.createLinearGradient(0, 0, W * 0.6, H);
  gr.addColorStop(0, '#0f1a2b'); gr.addColorStop(0.55, '#1f3557'); gr.addColorStop(1, '#3c5a85');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const a = Math.min(1, t / 0.8);
  g.globalAlpha = a;
  const lw = 560, lh = lw * M.blanco.height / M.blanco.width; const y0 = 90;
  g.drawImage(M.blanco, (W - lw) / 2, y0 - (1 - a) * 20, lw, lh);
  g.fillStyle = '#c9d6ea'; g.font = '600 30px Montserrat'; g.textAlign = 'center';
  g.fillText('C O N T R O L A R', W / 2, y0 + lh + 80);
  g.fillStyle = '#fff'; g.font = '800 86px Montserrat';
  g.fillText(esc.titulo, W / 2, y0 + lh + 175);
  if (esc.sub) { g.fillStyle = '#dfe7f3'; g.font = '500 40px Montserrat'; g.fillText(esc.sub, W / 2, y0 + lh + 240); }
  g.textAlign = 'left'; g.globalAlpha = 1;
}

function barra(esc, numero, cantidad) {
  g.fillStyle = C.oscuro; g.fillRect(0, 0, W, 92);
  const lh = 54, lw = lh * M.blanco.width / M.blanco.height;
  g.drawImage(M.blanco, 36, 19, lw, lh);
  g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(36 + lw + 30, 22, 2, 48);
  g.fillStyle = '#fff'; g.font = '700 40px Montserrat';
  g.fillText(esc.titulo, 36 + lw + 62, 60);
  let x = W - 40; g.textAlign = 'right'; g.font = '600 26px Montserrat'; g.fillStyle = '#9aa8bd';
  g.fillText(`${numero} / ${cantidad}`, x, 57);
  if (esc.admin) {
    const txt = 'SÓLO ADMINISTRADOR'; g.font = '700 22px Montserrat'; const tw = g.measureText(txt).width;
    const bx = x - 110 - tw - 36; rr(bx, 28, tw + 36, 38, 19); g.fillStyle = '#fdf3e3'; g.fill();
    g.fillStyle = C.naranja; g.textAlign = 'left'; g.fillText(txt, bx + 18, 55);
  }
  g.textAlign = 'left';
}

// Dibuja una captura según su forma: pantalla ancha (con acercamiento), formulario alto (se desplaza) o celular (con marco).
function dibujarImagen(img, foco, p, alpha, titulo) {
  const w = img.width, h = img.height, r = w / h;
  g.save(); g.globalAlpha = alpha;
  if (r < 0.62) { // celular
    const dh = AREA.h - 20, dw = dh * r; const x = 1180 - dw / 2, y = AREA.y + 10;
    ladoTitulo(titulo);
    g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 30; rr(x - 14, y - 14, dw + 28, dh + 28, 46); g.fillStyle = '#141414'; g.fill(); g.shadowBlur = 0;
    g.save(); rr(x, y, dw, dh, 34); g.clip(); g.drawImage(img, x, y, dw, dh); g.restore();
  } else if (r < 1.25) { // formulario alto: se muestra ancho y se desplaza
    const dw = Math.min(980, w * (AREA.h / h) > 980 ? 980 : Math.max(760, w * (AREA.h / h)));
    const esc = dw / w; const altoTotal = h * esc;
    const dh = Math.min(AREA.h, altoTotal); const x = 1250 - dw / 2, y = AREA.y + (AREA.h - dh) / 2;
    ladoTitulo(titulo);
    const sh = dh / esc; const sy = (h - sh) * tramo(p, 0.18, 0.92);
    g.shadowColor = 'rgba(0,0,0,.18)'; g.shadowBlur = 28; rr(x, y, dw, dh, 16); g.fillStyle = '#fff'; g.fill(); g.shadowBlur = 0;
    g.save(); rr(x, y, dw, dh, 16); g.clip(); g.drawImage(img, 0, sy, w, sh, x, y, dw, dh); g.restore();
  } else { // pantalla ancha
    const s = Math.min(AREA.w / w, AREA.h / h); const dw = w * s, dh = h * s;
    const x = AREA.x + (AREA.w - dw) / 2, y = AREA.y + (AREA.h - dh) / 2;
    let sx = 0, sy = 0, sw = w, sh = h;
    if (foco) {
      const z = 1 + (foco.z - 1) * tramo(p, 0.06, 0.4);
      sw = w / z; sh = h / z;
      sx = Math.max(0, Math.min(w - sw, foco.cx * w - sw / 2));
      sy = Math.max(0, Math.min(h - sh, foco.cy * h - sh / 2));
    }
    g.shadowColor = 'rgba(0,0,0,.18)'; g.shadowBlur = 28; rr(x, y, dw, dh, 14); g.fillStyle = '#fff'; g.fill(); g.shadowBlur = 0;
    g.save(); rr(x, y, dw, dh, 14); g.clip(); g.drawImage(img, sx, sy, sw, sh, x, y, dw, dh); g.restore();
  }
  g.restore();
}
function ladoTitulo(titulo) {
  const iw = 150, ih = iw * M.iso.height / M.iso.width;
  g.globalAlpha = g.globalAlpha * 0.9;
  g.drawImage(M.iso, 120, AREA.y + 90, iw, ih);
  g.fillStyle = C.azul; g.font = '800 64px Montserrat';
  envolver(titulo, 560).forEach((l, i) => g.fillText(l, 120, AREA.y + 130 + ih + 80 + i * 78));
}

function subtitulo(texto) {
  if (!texto) return;
  g.font = '600 40px Montserrat';
  let lineas = envolver(texto, 1640);
  if (lineas.length > 2) { g.font = '600 34px Montserrat'; lineas = envolver(texto, 1660); }
  const alto = lineas.length * 50 + 34;
  const y = 1062 - alto;
  rr(80, y, W - 160, alto, 22); g.fillStyle = 'rgba(15,26,43,.94)'; g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center';
  lineas.forEach((l, i) => g.fillText(l, W / 2, y + 50 + i * 50));
  g.textAlign = 'left';
}

window.__iniciar = async (video) => {
  window.__estado = 'preparando';
  await prepararMarca();
  const actx = new AudioContext({ sampleRate: 48000 });
  const destino = actx.createMediaStreamDestination();
  // Cargar audios e imágenes; armar la línea de tiempo
  let cursor = 0.4; const escenas = [];
  for (const esc of video.escenas) {
    const buf = await actx.decodeAudioData(await (await fetch(esc.audio)).arrayBuffer());
    const imgs = await Promise.all((esc.imgs || []).map((n) => cargarImg(`../capturas/${n}.png`)));
    const inicio = cursor, voz = inicio + 0.45, fin = voz + buf.duration + (esc.tipo === 'portada' ? 1.2 : 0.75);
    const oraciones = esc.texto.split(/(?<=[.!?])\s+/); const totalChars = oraciones.reduce((s, o) => s + o.length, 0);
    let acc = voz; const subs = oraciones.map((o) => { const d = buf.duration * o.length / totalChars; const r = { a: acc, b: acc + d, o }; acc += d; return r; });
    escenas.push({ ...esc, buf, imgs, inicio, voz, fin, subs });
    cursor = fin;
  }
  const total = cursor + 0.5;
  const tipos = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1.4d0028,mp4a.40.2', 'video/mp4'];
  const mime = tipos.find((m) => MediaRecorder.isTypeSupported(m));
  const flujo = cv.captureStream(30);
  destino.stream.getAudioTracks().forEach((t) => flujo.addTrack(t));
  const rec = new MediaRecorder(flujo, { mimeType: mime, videoBitsPerSecond: 3500000, audioBitsPerSecond: 128000 });
  const partes = []; rec.ondataavailable = (e) => e.data.size && partes.push(e.data);

  if (actx.state !== 'running') await actx.resume();
  const t0 = actx.currentTime + 0.3;
  for (const e of escenas) { const s = actx.createBufferSource(); s.buffer = e.buf; s.connect(destino); s.start(t0 + e.voz); }
  rec.start(1000);
  window.__estado = 'grabando'; window.__total = total;

  await new Promise((listo) => {
    const cuadro = () => {
      const t = actx.currentTime - t0;
      window.__t = t;
      const i = Math.max(0, escenas.findIndex((e) => t < e.fin));
      const e = escenas[t >= escenas[escenas.length - 1].fin ? escenas.length - 1 : i];
      const n = escenas.indexOf(e) + 1;
      if (e.tipo === 'portada') portada(e, t - e.inicio, e.fin - e.inicio);
      else {
        g.fillStyle = C.fondo; g.fillRect(0, 0, W, H);
        barra(e, n, escenas.length);
        const k = e.imgs.length; const dur = (e.fin - e.inicio) / k; const local = t - e.inicio;
        const idx = Math.min(k - 1, Math.floor(local / dur)); const p = (local - idx * dur) / dur;
        const fundido = Math.min(1, (local - idx * dur) / 0.45);
        if (idx > 0 && fundido < 1) dibujarImagen(e.imgs[idx - 1], e.foco?.[idx - 1], 1, 1 - fundido, e.titulo);
        dibujarImagen(e.imgs[idx], e.foco?.[idx], p, idx > 0 ? fundido : Math.min(1, local / 0.4), e.titulo);
      }
      const sub = e.subs.find((s) => t >= s.a - 0.15 && t < s.b + 0.25);
      subtitulo(sub?.o);
      g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, H - 8, W, 8);
      g.fillStyle = '#e0312b'; g.fillRect(0, H - 8, W * Math.min(1, t / total), 8);
      if (t >= total) { clearInterval(intervalo); listo(); }
    };
    const intervalo = setInterval(cuadro, 1000 / 30);
    cuadro();
  });
  rec.stop();
  await new Promise((ok) => (rec.onstop = ok));
  const blob = new Blob(partes, { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = video.archivo + '.mp4'; document.body.appendChild(a); a.click();
  window.__fin = { tamano: blob.size, mime, duracion: total };
  window.__estado = 'listo';
};
</script>
</body>
</html>
